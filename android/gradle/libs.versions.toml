[versions]
agp = "9.4.0"
coreKtx = "1.18.0"
junit = "4.13.2"
kotlin = "2.2.10"
composeBom = "2026.02.01"
# Step 1 (#193): navigation for the five-destination shell.
navigationCompose = "2.10.0"
# Step 2 (#194): revision-keyed cloud cache + credential storage. Pinned here
# per the plan; the dependencies are wired in when the client is written.
room = "2.8.4"
securityCrypto = "1.1.0"
# KSP plugin version is coupled to the Kotlin version above.
ksp = "2.2.10-2.0.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# androidx.test.ext:junit is deliberately absent: there is no
# androidTestImplementation, so declaring it read as "instrumented tests are
# wired up" when they are not (#260). Add it back with the first real
# instrumented test, which is its own decision (KVM + an emulator action in CI).
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
