services:
  wattracker:
    build: .
    image: wattracker:latest
    container_name: wattracker
    restart: unless-stopped
    ports:
      # Published on every interface so the connector and your browser can
      # reach it. Narrow this to one interface (e.g. "192.168.1.10:8000:8000")
      # if the host is on more than one network.
      - "8000:8000"
    environment:
      # Every name you will reach this server by - the browser's Host header
      # and the ride page's WebSocket Origin are both checked against this
      # list. An IP, a hostname and a .local name are three separate entries.
      # Leave unset and only localhost is accepted, which is not what you want
      # on a server.
      WATTRACKER_PUBLIC_HOSTS: "${WATTRACKER_PUBLIC_HOSTS:-}"
      # Optional: LLM refinement of coaching text. The app is fully functional
      # without it.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Set both of these once something terminates TLS in front (tailscale
      # serve, Caddy). Until then the session cookie and the connector token
      # travel in clear text - see the README exposure note.
      # WATTRACKER_COOKIE_SECURE: "1"
      # WATTRACKER_PUBLIC_SCHEME: "https"
    volumes:
      # A named volume, deliberately, rather than a bind mount: SQLite in WAL
      # mode corrupts on NFS/SMB, and a bind mount is the easy way to end up
      # there without noticing. Local disk only.
      - wattracker-data:/data

volumes:
  wattracker-data:
