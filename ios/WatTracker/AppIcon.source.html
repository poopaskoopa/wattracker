<!doctype html><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#0f1419;}
  /* Full-bleed, square corners: iOS applies its own superellipse mask. */
  #c{width:1024px;height:1024px;background:#0f1419;display:block;}
  /* Artwork inset so the chainring teeth are not clipped by the mask. */
  svg{position:absolute;left:11%;top:11%;width:78%;height:78%;}
</style>
<div id="c">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>

      <stop offset="0" stop-color="#ffd34d"/><stop offset="1" stop-color="#f2a900"/>
    </linearGradient>
    <mask id="ring">
      <rect width="64" height="64" fill="#000"/>
      <circle cx="32" cy="32" r="27" fill="#fff"/>
      <circle cx="32" cy="32" r="19" fill="#000"/>
      <g fill="#000">
        <circle cx="32" cy="17" r="3.4"/><circle cx="45" cy="24.5" r="3.4"/>
        <circle cx="45" cy="39.5" r="3.4"/><circle cx="32" cy="47" r="3.4"/>
        <circle cx="19" cy="39.5" r="3.4"/><circle cx="19" cy="24.5" r="3.4"/>
      </g>
    </mask>
  </defs>
  <g fill="url(#g)">
    <rect x="30" y="1.5" width="4" height="7" rx="1.4"/>
    <rect x="30" y="1.5" width="4" height="7" rx="1.4" transform="rotate(30 32 32)"/>
    <rect x="30" y="1.5" width="4" height="7" rx="1.4" transform="rotate(60 32 32)"/>
    <rect x="30" y="1.5" width="4" height="7" rx="1.4" transform="rotate(90 32 32)"/>
    <rect x="30" y="1.5" width="4" height="7" rx="1.4" transform="rotate(120 32 32)"/>
    <rect x="30" y="1.5" width="4" height="7" rx="1.4" transform="rotate(150 32 32)"/>
    <rect x="30" y="1.5" width="4" height="7" rx="1.4" transform="rotate(180 32 32)"/>
    <rect x="30" y="1.5" width="4" height="7" rx="1.4" transform="rotate(210 32 32)"/>
    <rect x="30" y="1.5" width="4" height="7" rx="1.4" transform="rotate(240 32 32)"/>
    <rect x="30" y="1.5" width="4" height="7" rx="1.4" transform="rotate(270 32 32)"/>
    <rect x="30" y="1.5" width="4" height="7" rx="1.4" transform="rotate(300 32 32)"/>
    <rect x="30" y="1.5" width="4" height="7" rx="1.4" transform="rotate(330 32 32)"/>
  </g>
  <rect width="64" height="64" fill="url(#g)" mask="url(#ring)"/>
  <path d="M37.5 8 L17.5 35.5 H29 L26.5 56 L46.5 28.5 H35 Z"
        fill="url(#g)" stroke="#0f1419" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M37.5 8 L17.5 35.5 H29 L26.5 56 L46.5 28.5 H35 Z" fill="url(#g)"/>
</svg>
</div>
