<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}wattracker{% endblock %}</title>
    <!-- Tab icon: chainring + watt bolt. SVG for modern browsers, PNG fallback. -->
    <link rel="icon" type="image/svg+xml" href="{{ static_url('favicon.svg') }}">
    <!-- Safari ignores the SVG above; it uses the .ico (also served from / ). -->
    <link rel="icon" type="image/x-icon" sizes="any" href="/favicon.ico">
    <link rel="alternate icon" type="image/png" sizes="32x32" href="{{ static_url('favicon-32.png') }}">
    <link rel="apple-touch-icon" href="{{ static_url('apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ static_url('style.css') }}">
    <!-- Vendored locally so the app is fully self-contained (no external CDN).
         chart.js v4.5.1 UMD build; chartjs-plugin-zoom v2.2.0 (v2 requires
         chart.js v4 - keep these majors aligned when updating). -->
    <script src="{{ static_url('vendor/chart.umd.min.js') }}"></script>
    <!-- Drag-to-zoom on the time-series chart (loaded after chart.js). -->
    <script src="{{ static_url('vendor/chartjs-plugin-zoom.umd.min.js') }}"></script>
</head>
<body>
    <header>
        <h1><a href="/">wattracker</a></h1>
        {% if username %}
        <nav>
            <a href="/">Dashboard</a>
            <a href="/activities">Activities</a>
            <a href="/volume">Volume</a>
            <a href="/plan">Plan</a>
            <a href="/calendar">Calendar</a>
            <a href="/races">Races</a>
            <a href="/ride">Ride</a>
            <a href="/profile">Profile</a>
            <a href="/settings">Settings</a>
            <span class="user">{{ username }}</span>
            <form action="/logout" method="post" class="logout-form">
                <button type="submit" class="logout">Logout</button>
            </form>
        </nav>
        {% endif %}
    </header>
    <main class="{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
    <footer>
        <small>wattracker &mdash; local cycling training analyzer</small>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
