name: Windows

# A bare `push:` alongside `pull_request:` runs this twice for every commit on a
# branch with an open PR - and with one physical runner the second run queues
# behind the first rather than running beside it, so it is pure wall time. Runs
# 32386196713 and 32386202547 were the same commit, 10m45s of wall for 5m30s of
# work.
#
# Filtering push to `main` gives exactly one run per commit: a PR run while the
# work is in review, a push run once it merges. The trade is that a branch with
# no PR open gets no Windows run, so packaging breakage surfaces when the PR
# opens rather than on the push - which is the right moment for a job that takes
# six minutes of a machine shared with the trainer.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One physical Windows machine backs this workflow, and the installer smoke test
# below registers per-user state (a Start Menu group, an HKCU uninstall key) that
# two concurrent jobs would fight over. Serialize per ref.
#
# Deliberately no `cancel-in-progress`: packaging/smoke_installer.ps1 uninstalls
# in a `finally` block, and cancelling a job kills the process before that block
# runs, leaving a half-installed application behind on a runner that persists
# between jobs. A queued run is cheaper than a poisoned one.
concurrency:
  group: windows-${{ github.ref }}

jobs:
  test:
    # Still gated, but no longer for the original reason. The full suite runs on
    # every push and pull request in the `Cloud` workflow's self-hosted macOS
    # job, so duplicating ~6 minutes of it on the single physical Windows box
    # buys little for the wall time it costs. Windows-specific coverage is a
    # fair argument for turning this on later; if you do, move it to the
    # self-hosted runner (`runs-on: [self-hosted, Windows, X64]`) and give it
    # its own workspace virtual environment the way package-unsigned does,
    # rather than installing into the runner account's interpreter.
    if: ${{ false }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  windows-real:
    # The assertions no other platform can make: real icacls, real DPAPI, the
    # real shell32 known-folder call, the registry and the Win32 tray. The rest
    # of the suite runs on the Cloud workflow's macOS job, so this deliberately
    # does NOT duplicate it - the `test` job above stays gated for that reason.
    #
    # What it buys: tests/test_connector_autostart.py and
    # tests/test_connector_tray.py are marked windows_only, so macOS skips them
    # and nothing else runs them - 24 tests that execute nowhere today. And
    # tests/test_windows_real.py exists because a mock cannot catch a wrong
    # belief about the platform: test_windows_acl.py encoded the wrong icacls
    # output shape for weeks while every one of its tests passed.
    #
    # Same fork guard as package-unsigned: only branches pushed to this
    # repository reach the physical box that also runs the trainer.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-python, for the reason package-unsigned gives at
      # length: its Windows path needs administrator, and this runner's service
      # account deliberately is not one. Assert the machine-wide version rather
      # than trusting it.
      - name: Assert the runner's machine-wide Python
        shell: pwsh
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)"

      # Into a workspace venv, never the runner's interpreter: the tool cache
      # outlives the job on a self-hosted runner and the pollution accumulates.
      - name: Create workspace virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --disable-pip-version-check --upgrade pip
          .venv\Scripts\python -m pip install --disable-pip-version-check -e ".[dev,ble,connector,webview]"

      - name: Real Windows APIs
        shell: pwsh
        run: .venv\Scripts\python -m pytest tests/test_windows_real.py -q

      # Separate step so a failure here is legible: these drive real Win32
      # windows and HKCU, and the runner's service account has no interactive
      # desktop, which is a difference from a developer's session.
      - name: Registry and tray
        shell: pwsh
        run: .venv\Scripts\python -m pytest tests/test_connector_autostart.py tests/test_connector_tray.py -q

  package-unsigned:
    # See the same gate in cloud.yml. This job is the sharper of the two: the
    # PyInstaller spec, the Inno Setup script and smoke_installer.ps1 all come
    # from the checked-out branch, and the smoke test installs and runs the
    # installer it just built. On a public repository that is arbitrary code
    # execution on the physical box that also runs the trainer, so fork PRs are
    # excluded and only branches pushed to this repository reach the runner.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Deliberately no actions/setup-python. Its Windows path is not a
      # tool-cache unpack: installers/win-setup-template.ps1 in
      # actions/python-versions runs the official installer with
      # InstallAllUsers=1 and clears keys under
      # HKLM\...\Installer\UserData\S-1-5-18\Products, so it requires
      # administrator. This runner's service account deliberately is not one,
      # and granting it admin would remove the isolation the installer smoke
      # test depends on - see docs/windows-packaging.md. Python 3.12 is
      # installed machine-wide on the runner instead.
      #
      # That makes the interpreter a property of the machine rather than
      # something this file pins, so assert the version here instead of
      # trusting it. A drifted box fails on this line, naming the version it
      # found, rather than somewhere inside a PyInstaller build. The same
      # reasoning as cloud.yml's `assert sys.version_info >= (3, 12)`.
      #
      # Losing setup-python also loses `cache: pip`, which costs nothing here:
      # pip's own cache in the runner account's profile persists between jobs
      # on a machine that is not discarded.
      - name: Assert the runner's machine-wide Python
        shell: pwsh
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)"

      # A self-hosted runner keeps whatever the previous job left behind. Two of
      # the things the installer registers cannot be redirected away from a
      # shared location: packaging/wattracker.iss sets DisableProgramGroupPage=yes,
      # which makes Inno ignore /GROUP, so the Start Menu group name is fixed at
      # compile time; and the uninstall key is always named {AppId}_is1. Both are
      # per-user, which is why the runner service runs as its own account (see
      # docs/windows-packaging.md) - that keeps them out of the developer's hive
      # entirely. What the account cannot prevent is a run that died between
      # install and uninstall leaving its own state behind, which would then fail
      # a later run somewhere much harder to read than here.
      - name: Assert no leftover install state
        shell: pwsh
        run: |
          $leftovers = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{63E9478B-5D6D-4D36-9202-E8C7941AD567}_is1"
            (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\wattracker")
          ) | Where-Object { Test-Path -LiteralPath $_ }
          if ($leftovers) {
            $leftovers | ForEach-Object { Write-Host "leftover install state: $_" }
            throw "A previous run left wattracker install state on this runner. Remove the paths listed above, then re-run."
          }

      # Everything the job installs goes into a virtual environment inside the
      # workspace, and nothing is installed into the interpreter itself. On a
      # hosted runner that distinction does not matter because the whole machine
      # is discarded; on a self-hosted runner the tool cache outlives the job and
      # the pollution accumulates run over run. actions/checkout runs
      # `git clean -ffdx`, so this directory starts empty every time.
      #
      # The path is load-bearing beyond hygiene: scripts/wattracker.ps1 resolves
      # `<repo>\.venv\Scripts\python.exe` as its interpreter of last resort, which
      # is what lets tests\windows\lifecycle.ps1 start the app from source.
      # This runner shares a physical box with the trainer and Zwift, so a build
      # can land in the middle of a hardware session. Nothing here touches
      # Bluetooth, and every script binds a dynamically chosen free loopback
      # port rather than a fixed one, so neither the trainer link nor a live
      # session's server is contended. What is contended is the CPU: the
      # PyInstaller freeze and the Inno Setup LZMA compress each saturate every
      # core for minutes.
      #
      # Dropping the shell to BelowNormal lets Zwift preempt them; the build's
      # own children (pip, PyInstaller, ISCC) inherit it. BelowNormal and not
      # Idle deliberately - at Idle the runner's heartbeat can starve under
      # sustained load and the job gets reported lost.
      #
      # Note this does NOT lower I/O priority, which is a separate axis on
      # Windows and cannot be set on another process from outside it. A build
      # still competes for the disk. Add the same line to any new step that does
      # heavy work; the four that do today each carry it.
      - name: Create workspace virtual environment
        shell: pwsh
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          python -m venv .venv
          .venv\Scripts\python -m pip install --disable-pip-version-check --upgrade pip
          # connector and webview are the frozen connector's own halves: the
          # websockets client it dials the server with, and the ctypes WebView
          # binding its tray window uses. The connector spec collects both
          # best-effort, so leaving them out here does not fail the build - it
          # produces a connector that is quietly missing the radio or the
          # window, which is exactly what the smoke below exists to catch.
          .venv\Scripts\python -m pip install --disable-pip-version-check build -e ".[dev,ble,package,connector,webview]"
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $innoVersion = "6.7.3"
          $expectedInnoSha256 = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $innoInstaller = Join-Path $env:RUNNER_TEMP "innosetup-$innoVersion.exe"
          $innoRoot = Join-Path $env:RUNNER_TEMP "Inno Setup 6"
          Invoke-WebRequest `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" `
            -OutFile $innoInstaller
          $actualInnoSha256 = (Get-FileHash -LiteralPath $innoInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          $signature = Get-AuthenticodeSignature -FilePath $innoInstaller
          $publisher = if ($signature.SignerCertificate) {
            $signature.SignerCertificate.GetNameInfo(
              [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
              $false
            )
          }
          # Print what was observed before asserting on it. A step that proves
          # its result only by not throwing leaves the run log unable to answer
          # "what did the digest and publisher actually say" - which is the
          # question this pinned check exists to answer. Printing first also
          # means a failing run shows the value it got, not just that it
          # differed.
          Write-Host "Inno Setup $innoVersion digest (observed): $actualInnoSha256"
          Write-Host "Inno Setup $innoVersion digest (pinned):   $expectedInnoSha256"
          Write-Host "Authenticode status:    $($signature.Status)"
          Write-Host "Authenticode publisher: $publisher"
          if ($actualInnoSha256 -cne $expectedInnoSha256) {
            throw "Inno Setup compiler SHA-256 verification failed"
          }
          if ($signature.Status -ne "Valid" -or $publisher -cne "Pyrsys B.V.") {
            throw "Inno Setup compiler signature verification failed"
          }
          $install = Start-Process -FilePath $innoInstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$innoRoot`""
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0 -or -not (Test-Path -LiteralPath "$innoRoot\ISCC.exe")) {
            throw "Inno Setup compiler installation failed with exit code $($install.ExitCode)"
          }
          $innoRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: PowerShell lifecycle safety
        shell: powershell
        run: tests\windows\lifecycle.ps1
      - name: Build wheel and installed smoke
        shell: pwsh
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          .venv\Scripts\python -m build --wheel
          $smoke = Join-Path $env:RUNNER_TEMP "wheel-smoke"
          .venv\Scripts\python -m venv $smoke
          & "$smoke\Scripts\python.exe" -m pip install (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          Push-Location $env:RUNNER_TEMP
          & "$smoke\Scripts\python.exe" "$env:GITHUB_WORKSPACE\packaging\smoke_installed.py"
          Pop-Location
      - name: Build onedir and smoke
        shell: pwsh
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          .venv\Scripts\python -m PyInstaller --clean --noconfirm packaging\wattracker.spec
          powershell -File packaging\smoke_frozen.ps1 -Executable dist\wattracker\wattracker.exe
          $version = .venv\Scripts\python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          ISCC.exe "/DAppVersion=$version" packaging\wattracker.iss
          $setup = "dist\wattracker-$version-windows-x64-unsigned-setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Setup compiler produced no artifact" }
          powershell -File packaging\smoke_installer.ps1 -Installer $setup
      # The connector is the other half of a split install: the piece that runs
      # on the machine where Zwift is, frozen onefile and windowed rather than
      # onedir. It is built here because this is the only job in the repository
      # that can freeze a Windows binary at all - windows-release.yml also
      # builds it, but that workflow fires on a `v*` tag and stays hard-disabled
      # until a signing certificate exists. Until then, this step is the whole
      # of the connector's build coverage.
      #
      # PyInstaller saturates every core, so this carries the same priority drop
      # as the three steps above it that do real work.
      #
      # The smoke is not dressing. The connector serves no UI to request, so
      # nothing else proves the binary does anything at all: it must refuse to
      # run unpaired and say why, connect and answer a request against a stub
      # server, and still import bleak and webviewpy inside the frozen process.
      # The last of those is what catches a spec whose best-effort collection
      # quietly stopped collecting.
      #
      # Safe on a runner that persists and shares a box with the trainer: every
      # check points WATTRACKER_CONNECTOR_DIR at its own temporary directory, so
      # it cannot read or write a real connector configuration, and the stub
      # server binds a free loopback port rather than a fixed one. Nothing here
      # touches Bluetooth, the registry, or the autostart key.
      - name: Build frozen connector and smoke
        shell: pwsh
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          .venv\Scripts\python -m PyInstaller --clean --noconfirm packaging\wattracker-connector.spec
          if (-not (Test-Path -LiteralPath "dist\WattrackerConnector.exe")) {
            throw "Frozen connector was not produced"
          }
          .venv\Scripts\python packaging\smoke_frozen_connector.py dist\WattrackerConnector.exe
      # The portable zip is deliberately not built or uploaded. It was the
      # largest single file at 61.8 MB and it duplicated the installer's
      # payload: the same onedir tree, wrapped differently rather than built
      # differently. The portable form still ships where it is actually
      # consumed - windows-release.yml builds and signs its own zip on a `v*`
      # tag - so what is lost is a per-commit portable copy that nothing
      # downstream reads. A run's payload is ~45 MB without it, plus the
      # connector.
      #
      # The connector is the one addition that is not a duplicate: it is a
      # separate onefile binary for a separate machine, and no other artifact
      # contains it. It is also, while windows-release.yml stays hard-disabled,
      # the only way anyone gets a built connector without a Windows checkout
      # and a toolchain - which is what a rider testing a ride needs.
      #
      # It weighs 12.3 MB, measured off a real freeze of this tree on
      # 2026-08-22 rather than estimated: the excludes in
      # packaging/_connector_excludes.py keep numpy, pandas, scipy and fastapi
      # out, which is most of why a binary carrying bleak, websockets and a
      # WebView binding is a quarter of the installer's size.
      # Build on every PR commit, upload only on a merge to main.
      #
      # The account's shared storage is 500 MB and this step is the only thing
      # in the repo that consumes it (cloud.yml uploads nothing; the release
      # workflows fire only on `v*` tags). Uploading on every push does not fit:
      # at ~93 triggers a week, 45 MB a run needs several gigabytes. Merges to
      # main run ~8.75 times a week, so ~394 MB at 7-day retention - which fits,
      # but leaves too little for a busy week. Five days holds ~6.25 runs, so
      # ~280 MB for the app's payload and ~77 MB for the connector beside it:
      # ~358 MB against a 500 MB ceiling. That fits, and the headroom is real
      # but not large. If it tightens, the retention window is the dial to turn
      # first - it costs only how far back a downloadable copy reaches, and
      # nothing downstream reaches back at all.
      #
      # Nothing is lost by not uploading on PR commits. The job still proves the
      # ISCC compile, the frozen smoke, the full install/upgrade/tampered-
      # uninstall/uninstall, and the connector's own freeze and smoke on every
      # one of them; the artifact is a downloadable convenience, and nothing
      # downstream reads it - windows-release.yml builds its own signed
      # artifacts on a tag.
      #
      # The ref test is redundant while push is filtered to main above, and is
      # kept deliberately: it is what stops a later re-broadening of the trigger
      # from silently turning the upload back on for every branch.
      # The upload used to carry the "did the build produce anything?" signal via
      # if-no-files-found: error. It cannot any more: the first run of this job
      # on main (32477527515) built and smoked everything successfully and then
      # failed on `Artifact storage quota has been hit`, turning a green build
      # into a red check on main. The sizing above is sound but assumes the
      # account's 500 MB is available, and it is not - this repo holds zero
      # artifacts, so the storage is committed elsewhere and cannot be reclaimed
      # from here. GitHub also recalculates usage only every 6-12 hours, so the
      # wall outlasts whatever frees it.
      #
      # So the signal moves off the upload and onto the step below, which reads
      # the filesystem this job just wrote. A missing installer still fails the
      # job, loudly and on the line that names it; a full quota no longer can.
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        name: Assert the build produced a wheel, an installer and a connector
        shell: pwsh
        run: |
          $whl = @(Get-ChildItem dist\*.whl -ErrorAction SilentlyContinue)
          $exe = @(Get-ChildItem dist\*-unsigned-setup.exe -ErrorAction SilentlyContinue)
          $connector = @(Get-ChildItem dist\WattrackerConnector.exe -ErrorAction SilentlyContinue)
          Write-Host "wheel(s): $($whl.Count), installer(s): $($exe.Count), connector(s): $($connector.Count)"
          if ($whl.Count -eq 0) { throw "no wheel in dist\ - the build did not produce one" }
          if ($exe.Count -eq 0) { throw "no *-unsigned-setup.exe in dist\ - ISCC did not produce an installer" }
          if ($connector.Count -eq 0) { throw "no WattrackerConnector.exe in dist\ - the connector freeze did not produce one" }

      # continue-on-error, not `|| true`: a quota failure stays visible as a
      # yellow step you can click into, rather than being swallowed. The job and
      # the check on main go green because the build genuinely passed.
      # if-no-files-found drops to `warn` because the assert above now owns that
      # failure - leaving it at `error` would just reintroduce a red step for a
      # condition already covered.
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: wattracker-windows-x64-unsigned
          path: |
            dist/*.whl
            dist/*-unsigned-setup.exe
            dist/WattrackerConnector.exe
          if-no-files-found: warn
          retention-days: 5
