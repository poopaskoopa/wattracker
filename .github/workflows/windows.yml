name: Windows

# Filtering push to `main` gives one review run per PR commit and one run after
# merge. The post-merge run is also where the unsigned artifacts are uploaded.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Still gated, but no longer for the original reason. The full suite runs on
    # every push and pull request in the `Cloud` workflow's self-hosted macOS
    # job, so duplicating ~6 minutes of it in this workflow
    # buys little for the wall time it costs. Windows-specific coverage is a
    # fair argument for turning this on later; if you do, keep it on the
    # hosted runner with the setup-python configuration already shown here.
    if: ${{ false }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  windows-real:
    # The assertions no other platform can make: real icacls, real DPAPI, the
    # real shell32 known-folder call, the registry and the Win32 tray. The rest
    # of the suite runs on the Cloud workflow's macOS job, so this deliberately
    # does NOT duplicate it - the `test` job above stays gated for that reason.
    #
    # What it buys: tests/test_connector_autostart.py and
    # tests/test_connector_tray.py are marked windows_only, so macOS skips them
    # and nothing else runs them - 24 tests that execute nowhere today. And
    # tests/test_windows_real.py exists because a mock cannot catch a wrong
    # belief about the platform: test_windows_acl.py encoded the wrong icacls
    # output shape for weeks while every one of its tests passed.
    #
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e ".[dev,ble,connector,webview]"

      - name: Real Windows APIs
        shell: pwsh
        run: python -m pytest tests/test_windows_real.py -q

      # Separate step so a failure here is legible: these drive real Win32
      # windows and HKCU and execute on no other platform.
      - name: Registry and tray
        shell: pwsh
        run: python -m pytest tests/test_connector_autostart.py tests/test_connector_tray.py -q

  package-unsigned:
    # Build the Windows installer and frozen tray connector, then exercise the
    # lifecycle, wheel, frozen application, installer and connector smokes on a
    # real Windows host. These paths do not execute in the platform-neutral
    # suite, and Inno Setup compilation is Windows-only.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          # connector and webview are the frozen connector's own halves: the
          # websockets client it dials the server with, and the ctypes WebView
          # binding its tray window uses. The connector spec collects both
          # best-effort, so leaving them out here does not fail the build - it
          # produces a connector that is quietly missing the radio or the
          # window, which is exactly what the smoke below exists to catch.
          python -m pip install --disable-pip-version-check build -e ".[dev,ble,package,connector,webview]"
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $innoVersion = "6.7.3"
          $expectedInnoSha256 = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $innoInstaller = Join-Path $env:RUNNER_TEMP "innosetup-$innoVersion.exe"
          $innoRoot = Join-Path $env:RUNNER_TEMP "Inno Setup 6"
          Invoke-WebRequest `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" `
            -OutFile $innoInstaller
          $actualInnoSha256 = (Get-FileHash -LiteralPath $innoInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          $signature = Get-AuthenticodeSignature -FilePath $innoInstaller
          $publisher = if ($signature.SignerCertificate) {
            $signature.SignerCertificate.GetNameInfo(
              [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
              $false
            )
          }
          # Print what was observed before asserting on it. A step that proves
          # its result only by not throwing leaves the run log unable to answer
          # "what did the digest and publisher actually say" - which is the
          # question this pinned check exists to answer. Printing first also
          # means a failing run shows the value it got, not just that it
          # differed.
          Write-Host "Inno Setup $innoVersion digest (observed): $actualInnoSha256"
          Write-Host "Inno Setup $innoVersion digest (pinned):   $expectedInnoSha256"
          Write-Host "Authenticode status:    $($signature.Status)"
          Write-Host "Authenticode publisher: $publisher"
          if ($actualInnoSha256 -cne $expectedInnoSha256) {
            throw "Inno Setup compiler SHA-256 verification failed"
          }
          if ($signature.Status -ne "Valid" -or $publisher -cne "Pyrsys B.V.") {
            throw "Inno Setup compiler signature verification failed"
          }
          $install = Start-Process -FilePath $innoInstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$innoRoot`""
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0 -or -not (Test-Path -LiteralPath "$innoRoot\ISCC.exe")) {
            throw "Inno Setup compiler installation failed with exit code $($install.ExitCode)"
          }
          $innoRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: PowerShell lifecycle safety
        shell: powershell
        run: |
          $env:WATTRACKER_EXECUTABLE = (Get-Command wattracker).Source
          tests\windows\lifecycle.ps1
      - name: Build wheel and installed smoke
        shell: pwsh
        run: |
          python -m build --wheel
          $smoke = Join-Path $env:RUNNER_TEMP "wheel-smoke"
          python -m venv $smoke
          & "$smoke\Scripts\python.exe" -m pip install (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          Push-Location $env:RUNNER_TEMP
          & "$smoke\Scripts\python.exe" "$env:GITHUB_WORKSPACE\packaging\smoke_installed.py"
          Pop-Location
      - name: Build onedir and smoke
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm packaging\wattracker.spec
          powershell -File packaging\smoke_frozen.ps1 -Executable dist\wattracker\wattracker.exe
          $version = python packaging\_version.py
          ISCC.exe "/DAppVersion=$version" packaging\wattracker.iss
          $setup = "dist\wattracker-$version-windows-x64-unsigned-setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Setup compiler produced no artifact" }
          powershell -File packaging\smoke_installer.ps1 -Installer $setup
      # The connector is the other half of a split install: the piece that runs
      # on the machine where Zwift is, frozen onefile and windowed rather than
      # onedir. It is built here because this is the only job in the repository
      # that can freeze a Windows binary at all - windows-release.yml also
      # builds it, but that workflow fires on a `v*` tag and stays hard-disabled
      # until a signing certificate exists. Until then, this step is the whole
      # of the connector's build coverage.
      #
      # The smoke is not dressing. The connector serves no UI to request, so
      # nothing else proves the binary does anything at all: it must refuse to
      # run unpaired and say why, connect and answer a request against a stub
      # server, and still import bleak and webviewpy inside the frozen process.
      # The last of those is what catches a spec whose best-effort collection
      # quietly stopped collecting.
      #
      - name: Build frozen connector and smoke
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm packaging\wattracker-connector.spec
          if (-not (Test-Path -LiteralPath "dist\WattrackerConnector.exe")) {
            throw "Frozen connector was not produced"
          }
          python packaging\smoke_frozen_connector.py dist\WattrackerConnector.exe
      # These are the Windows payloads consumed by the single rolling-release
      # publisher. Keep the cross-runner handoff narrow and short-lived.
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        name: Assert the build produced an installer and a connector
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem dist\*-unsigned-setup.exe -ErrorAction SilentlyContinue)
          $connector = @(Get-ChildItem dist\WattrackerConnector.exe -ErrorAction SilentlyContinue)
          Write-Host "installer(s): $($exe.Count), connector(s): $($connector.Count)"
          if ($exe.Count -eq 0) { throw "no *-unsigned-setup.exe in dist\ - ISCC did not produce an installer" }
          if ($connector.Count -eq 0) { throw "no WattrackerConnector.exe in dist\ - the connector freeze did not produce one" }

      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        # These are required by publish-preview. A quota failure must fail the
        # release workflow rather than leave a green run with a stale preview.
        uses: actions/upload-artifact@v4
        with:
          name: desktop-preview-windows
          path: |
            dist/*-unsigned-setup.exe
            dist/WattrackerConnector.exe
          if-no-files-found: error
          retention-days: 1

  macos-preview:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      WATTRACKER_AUTO_SCAN: "0"
      WATTRACKER_OPEN_BROWSER: "0"
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build unsigned macOS DMG
        env:
          WATTRACKER_BUILD_PYTHON: python
        run: packaging/build-macos.sh
      - name: Hand off the DMG to the publisher
        uses: actions/upload-artifact@v4
        with:
          name: desktop-preview-macos
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 1

  publish-preview:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [package-unsigned, macos-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: desktop-preview-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip stale preview publishes
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ -z "$main_sha" ]]; then
            echo "Could not read the current main head from origin." >&2
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_SHA is not the current main head ($main_sha); skipping stale preview."
            exit 0
          fi

          preview_ref="$(git ls-remote --refs origin refs/tags/preview-latest | awk 'NR == 1 { print $1 }')"
          if [[ -n "$preview_ref" ]]; then
            git fetch --quiet --force --no-tags origin refs/tags/preview-latest:refs/tags/preview-latest
            preview_sha="$(git rev-parse 'refs/tags/preview-latest^{commit}')"
            if [[ "$GITHUB_SHA" != "$preview_sha" ]]; then
              if git merge-base --is-ancestor "$GITHUB_SHA" "$preview_sha" || \
                ! git merge-base --is-ancestor "$preview_sha" "$GITHUB_SHA"; then
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "$GITHUB_SHA is not newer than preview-latest ($preview_sha); skipping stale preview."
                exit 0
              fi
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Download platform payloads
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-preview-*
          path: release
          merge-multiple: true
      - name: Verify payloads and write checksums
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg=(release/*.dmg)
          setup=(release/*-unsigned-setup.exe)
          connector=(release/WattrackerConnector.exe)
          test "${#dmg[@]}" -eq 1 || { echo "expected one macOS DMG" >&2; exit 1; }
          test "${#setup[@]}" -eq 1 || { echo "expected one Windows setup" >&2; exit 1; }
          test "${#connector[@]}" -eq 1 || { echo "expected one connector executable" >&2; exit 1; }
          asset_suffix="${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          dmg_asset="desktop-preview-${asset_suffix}-macos.dmg"
          setup_asset="desktop-preview-${asset_suffix}-windows-setup.exe"
          connector_asset="desktop-preview-${asset_suffix}-connector.exe"
          checksums_asset="desktop-preview-${asset_suffix}-SHA256SUMS.txt"
          cp "${dmg[0]}" "release/$dmg_asset"
          cp "${setup[0]}" "release/$setup_asset"
          cp "${connector[0]}" "release/$connector_asset"
          (
            cd release
            sha256sum -- "$dmg_asset" "$setup_asset" "$connector_asset" \
              | LC_ALL=C sort -k2 > "$checksums_asset"
          )
      - name: Replace rolling preview release
        if: steps.freshness.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha_now="$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ -z "$main_sha_now" ]]; then
            echo "Could not read the current main head from origin." >&2
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$main_sha_now" ]]; then
            echo "$GITHUB_SHA is no longer the current main head ($main_sha_now); skipping preview replacement."
            exit 0
          fi

          observed_preview_ref="$(git ls-remote --refs origin refs/tags/preview-latest | awk 'NR == 1 { print $1 }')"
          if [[ -n "$observed_preview_ref" ]]; then
            git fetch --quiet --force --no-tags origin refs/tags/preview-latest:refs/tags/preview-latest
            observed_preview_sha="$(git rev-parse 'refs/tags/preview-latest^{commit}')"
            if [[ "$GITHUB_SHA" != "$observed_preview_sha" ]]; then
              if git merge-base --is-ancestor "$GITHUB_SHA" "$observed_preview_sha" || \
                ! git merge-base --is-ancestor "$observed_preview_sha" "$GITHUB_SHA"; then
                echo "$GITHUB_SHA is not newer than preview-latest ($observed_preview_sha); skipping preview replacement."
                exit 0
              fi
            fi
          fi

          asset_suffix="${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          assets=(release/desktop-preview-"$asset_suffix"-*)
          test "${#assets[@]}" -eq 4 || { echo "expected four versioned preview assets" >&2; exit 1; }
          expected_preview_ref="$observed_preview_ref"
          if gh release view preview-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Unique names keep the previous complete asset set available until
            # all assets for this publish have uploaded successfully.
            gh release upload preview-latest "${assets[@]}" --repo "$GITHUB_REPOSITORY"
          else
            # A first publish has no previous asset set to preserve. Create
            # its tag explicitly before asking GitHub to create the release:
            # draft release creation is not guaranteed to create the tag.
            if [[ -n "$observed_preview_ref" ]]; then
              gh release create preview-latest "${assets[@]}" \
                --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
                --title "Desktop preview (rolling)" \
                --notes "Unsigned desktop preview built from main commit $GITHUB_SHA."
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref=refs/tags/preview-latest -f sha="$GITHUB_SHA"
              expected_preview_ref="$(git ls-remote --refs origin refs/tags/preview-latest | awk 'NR == 1 { print $1 }')"
              if [[ "$expected_preview_ref" != "$GITHUB_SHA" ]]; then
                echo "New preview tag points to ${expected_preview_ref:-<missing>}, expected $GITHUB_SHA." >&2
                exit 1
              fi
              git fetch --quiet --force --no-tags origin refs/tags/preview-latest:refs/tags/preview-latest
              gh release create preview-latest "${assets[@]}" \
                --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
                --title "Desktop preview (rolling)" \
                --notes "Unsigned desktop preview built from main commit $GITHUB_SHA."
            fi
          fi

          # Retarget only after the new complete asset set exists. The exact
          # observed ref is leased; any intervening tag update rejects the push.
          git push "--force-with-lease=refs/tags/preview-latest:${expected_preview_ref}" \
            origin "$GITHUB_SHA:refs/tags/preview-latest"
          gh release edit preview-latest --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft=false --prerelease \
            --title "Desktop preview (rolling)" \
            --notes "Unsigned desktop preview built from main commit $GITHUB_SHA."
          # Remove old assets only after upload, leased tag retarget, and release
          # publication succeed. The current run's names all share this prefix.
          export CURRENT_ASSET_PREFIX="desktop-preview-${asset_suffix}-"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/preview-latest" \
            --jq '.assets[] | select(.name | startswith(env.CURRENT_ASSET_PREFIX) | not) | .id' \
            | while read -r asset_id; do
                [[ -n "$asset_id" ]] && gh api --silent --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              done
