name: iOS TestFlight release

# Fires on an `ios-v*` tag, deliberately a different prefix from the `v*` that
# macos-release.yml and windows-release.yml both use. The desktop app and the
# iOS app version independently, and a shared `v*` prefix would mean every
# desktop release tag also fired an iOS archive (and vice versa) - three
# release workflows racing for one physical runner over a tag that concerned
# one of them.
#
# FORK SAFETY. This repository is public and the job below both reads
# code-signing secrets and runs on a self-hosted runner that is a physical
# machine, not a discarded VM. Neither may ever be reachable from a fork.
#
# A `push` trigger restricted to tags is inherently safe from that, and it is
# worth saying why rather than leaving it as folklore: a fork's tags live in
# the fork's repository and fire that fork's workflows using that fork's
# secrets - `push` events from a fork do not run here at all. That is a
# stronger guarantee than cloud.yml's and windows.yml's
# `github.event.pull_request.head.repo.full_name == github.repository` guard,
# which those files need only because they also trigger on `pull_request`.
# This workflow has no `pull_request` trigger and must not gain one: adding it
# would expose both the secrets and the runner to any fork's diff, and the
# `if:` below is not a substitute for the trigger being right.
#
# The `if:` on the job is a second, narrower thing: it stops the job doing
# anything if the repository is ever forked WITH its tags and the fork's owner
# adds their own credentials, which would otherwise archive and upload our
# bundle identifier from someone else's account.
on:
  push:
    tags:
      - "ios-v*"
  # Manual runs exist so the signing path can be exercised without
  # spending a tag. A dispatch run archives and exports but does not
  # upload, so it can never publish a build to App Store Connect.
  workflow_dispatch:
    inputs:
      diagnose_signing:
        description: "Print keychain contents after import (no key material)"
        type: boolean
        default: false

permissions:
  contents: read

# One physical macOS runner backs this, and it is the same machine that runs
# the Cloud workflow's test job. A second release archive running beside the
# first would contend for every core, two exports would fight over the
# provisioning profiles that -allowProvisioningUpdates installs into the
# runner user's shared profile directory, and both would be rewriting the
# user keychain search list under each other. Serialize, and do not cancel in
# progress: the cleanup step is an `if: always()` step, and cancelling a job
# can kill it before that step runs, which would leave TWO private keys on a
# machine that is not discarded - the App Store Connect key in $RUNNER_TEMP
# and the distribution key in the job's keychain - plus a search list pointing
# at a keychain nothing owns.
concurrency:
  group: ios-release

jobs:
  archive-export-upload:
    # See the fork-safety note above: this is the "forked with tags, then given
    # its own credentials" case, not the fork-PR case, which the trigger
    # already excludes.
    if: github.repository == 'poopaskoopa/wattracker'
    runs-on: [self-hosted, macOS]
    # WHY THIS IS STILL SELF-HOSTED, AND WHY THAT IS NOW A CHOICE.
    #
    # The comment that used to sit here said hosted runners were blocked at
    # the account level and that this was the only machine able to build for
    # Apple platforms at all. Both were true of a PRIVATE repository and
    # neither is true now: this repo is public, hosted runners are unmetered,
    # macos-release.yml was re-enabled on `macos-latest` on 2026-09-13, and
    # cloud.yml and android.yml run hosted jobs on every PR.
    #
    # Moving this job to `macos-latest` is the better end state, for two
    # reasons that have nothing to do with cost:
    #   - This runner is a laptop that sleeps. Jobs die at exactly 10m00s with
    #     no failed step and have to be re-run; a hosted VM does not sleep.
    #   - Signing secrets belong on an ephemeral machine. See the KNOWN
    #     RESIDUAL note further down, which says outright that the `security
    #     import -P` exposure "is worse here than on the ephemeral macOS VM
    #     that workflow describes, because this runner is not discarded". That
    #     residual is a consequence of this `runs-on`, not a fact of life.
    #
    # It is NOT flipped in this commit because one thing has to be checked on
    # hardware first: the steps below pin Xcode 26.6's SDK and the matching
    # iOS 26.5 simulator runtime, and the hosted image's Xcode is whatever
    # GitHub ships. Verify the image has them (or pin with `xcode-select`)
    # before changing this line - a release workflow that only fires on a tag
    # is the worst place to discover a toolchain mismatch.
    environment: ios-code-signing
    timeout-minutes: 60

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          # The repository convention, and it matters more here than usual: a
          # persisted credential would sit in .git/config on a runner that is
          # not torn down between jobs.
          persist-credentials: false

      # Nothing secret in this step, deliberately, so it can fail loudly and
      # early on a malformed tag before any credential is written to disk.
      #
      # THE BUILD NUMBER. App Store Connect rejects an upload whose
      # CFBundleVersion it has already accepted for this
      # CFBundleShortVersionString - it does not overwrite, it refuses, and it
      # refuses after the whole archive, export and upload have run. So the
      # build number has to be unique per delivery without anyone remembering
      # to bump it.
      #
      # `run_number.run_attempt` is that. run_number increases by one for every
      # run of this workflow and never repeats; run_attempt distinguishes the
      # re-runs of a single run, which is the failure mode worth naming: a job
      # that dies in the upload step and is re-run from the Actions UI keeps
      # its run_number, so a bare run_number would send Apple the exact build
      # number it just rejected, and the re-run would fail for a reason that
      # has nothing to do with why the first one did. CFBundleVersion accepts
      # up to three dot-separated integers and compares them component-wise, so
      # 41.1 < 41.2 < 42.1 orders the way it reads.
      #
      # The consequence to know: the build number is a property of CI, not of
      # the tag. Re-tagging the same commit produces a different build number,
      # which is correct - Apple is being told "this is a different delivery",
      # and it is.
      - name: Derive the version and build number
        env:
          # $GITHUB_REF_NAME rather than ${{ github.ref_name }}: a tag name is
          # attacker-supplied text as far as this shell is concerned, and
          # interpolating it into the script body would let a tag containing
          # shell metacharacters execute on the runner. Only someone who can
          # push to this repository can create a tag, but a guard that costs
          # one line does not need to argue about that.
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == ios-v* ]]; then
            version="${GITHUB_REF_NAME#ios-v}"
            # CFBundleShortVersionString: one to three non-negative integers.
            # Anything else is rejected by App Store Connect, and it is far
            # cheaper to say so here than after the archive.
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
              echo "Tag '$GITHUB_REF_NAME' does not carry a 1-3 component numeric version" >&2
              exit 1
            fi
          else
            # Manual dispatch archives and exports only; keep its diagnostic
            # build clearly separate from every App Store release version.
            version="0.0.0"
            echo "Non-tag diagnostic run; using marketing version $version"
          fi
          echo "MARKETING_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${RUN_NUMBER}.${RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "Building version $version build ${RUN_NUMBER}.${RUN_ATTEMPT}"

      # This must run before Archive: the host is an environment secret rather
      # than a checked-in config value. Keep it out of shell diagnostics and
      # reject URI-shaped values so an accidental scheme/path cannot change
      # the app's endpoint semantics.
      - name: Validate the iOS API host
        env:
          WATTRACKER_IOS_API_HOST: ${{ secrets.WATTRACKER_IOS_API_HOST }}
        run: |
          set -euo pipefail
          host="${WATTRACKER_IOS_API_HOST:-}"
          if [ -z "$host" ] || [[ "$host" =~ [[:space:]] ]]; then
            echo "WATTRACKER_IOS_API_HOST is missing, empty, or contains whitespace." >&2
            exit 1
          fi
          if [[ "$host" == *://* || "$host" == */* || "$host" == *\?* || "$host" == *#* || "$host" == *:* ]]; then
            echo "WATTRACKER_IOS_API_HOST must be a hostname, not a URL or path." >&2
            exit 1
          fi
          if ! [[ "$host" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$ ]]; then
            echo "WATTRACKER_IOS_API_HOST is not a valid hostname." >&2
            exit 1
          fi
          host_lower="$(printf '%s' "$host" | tr '[:upper:]' '[:lower:]')"
          if [ "$host_lower" = "api.wattracker.com" ]; then
            echo "WATTRACKER_IOS_API_HOST must not be the placeholder host." >&2
            exit 1
          fi
          echo "The iOS API host is valid."

      # Before anything is signed, because a failing test should cost nothing
      # but time. The iOS 26.5 simulator runtime matching Xcode 26.6's SDK is
      # installed on this runner, so a destination-based build resolves here;
      # ios/README.md describes the by-SDK fallback for a machine where it does
      # not.
      - name: Run the Swift test suite
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ios/WatTracker/WatTracker.xcodeproj \
            -scheme WatTracker \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath "$RUNNER_TEMP/ios-test-dd"

      # The App Store Connect API key, written to a file because that is the
      # only way any of the three tools that need it will take it - xcodebuild
      # wants -authenticationKeyPath, altool wants --p8-file-path, and neither
      # reads a key from stdin or an environment variable.
      #
      # Where it goes matters. $RUNNER_TEMP, never the workspace: the workspace
      # is what gets archived, exported and (in other workflows) uploaded, and
      # a key in it is one `path: dist/**` away from being published. It is
      # also not written to ~/.appstoreconnect/private_keys, which altool
      # searches by default - that directory belongs to the human who owns this
      # machine, a real key already lives in it, and a CI job has no business
      # writing to or deleting from it.
      #
      # umask 077 before the redirection, not chmod after: chmod after leaves a
      # window in which the file exists world-readable. The explicit chmod
      # below is belt and braces on top of that, not the mechanism.
      #
      # No `set -x` here or in any step below. The key is written by a shell
      # redirection from an environment variable, and tracing would print the
      # expansion.
      - name: Write the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_PRIVATE_KEY:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "The ios-code-signing environment did not supply the signing credentials." >&2
            echo "Check that this job declares 'environment: ios-code-signing'." >&2
            exit 1
          fi
          key_dir="$RUNNER_TEMP/asc"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          (umask 077; mkdir -p "$key_dir")
          (umask 077; printf '%s' "$ASC_PRIVATE_KEY" > "$key_path")
          chmod 600 "$key_path"
          # Prove the secret decoded into a usable key before spending ten
          # minutes on an archive that will fail at the last step. -noout, and
          # stderr discarded: a parse failure must report "the key did not
          # parse" and nothing about the key.
          if ! /usr/bin/openssl pkey -in "$key_path" -noout >/dev/null 2>&1; then
            echo "APP_STORE_CONNECT_PRIVATE_KEY did not parse as a private key." >&2
            echo "It must be the full PEM contents of the .p8, newlines included." >&2
            exit 1
          fi
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

          # The export options, templated here rather than committed: teamID is
          # an Apple account identifier and this repository is public. See the
          # long note at the top of ios/WatTracker/ExportOptions.plist for why
          # this is a copy in $RUNNER_TEMP and not an edit in place.
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cp ios/WatTracker/ExportOptions.plist "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$export_options" >/dev/null
          echo "EXPORT_OPTIONS_PLIST=$export_options" >> "$GITHUB_ENV"

      # THE DISTRIBUTION CERTIFICATE, and the correction of an assumption this
      # workflow was originally written on.
      #
      # -allowProvisioningUpdates plus an App Store Connect API key does NOT
      # issue a distribution certificate. It registers App IDs and it creates
      # and downloads provisioning profiles, but certificate issuance is not
      # something it will do: a certificate is a private key that Apple never
      # sees, so somebody has to generate the key and the CSR, and xcodebuild
      # will not do that on a whim. Left to itself, automatic signing finds
      # only the development certificates in the account and resolves to
      # development, and the archive then fails with either "conflicting
      # provisioning settings" or "has entitlements that require signing with
      # a development certificate" depending on which flags it is given. Both
      # messages mean "there is no distribution identity here".
      #
      # So the certificate is created once, deliberately, against
      # POST /v1/certificates, and its private key is carried to this job as a
      # .p12 in IOS_DIST_P12_B64. docs/ios-testflight.md has the creation and
      # rotation procedure; it expires a year after issue and nothing here
      # renews it.
      #
      # A dedicated keychain, not the runner user's login keychain. This
      # runner is a physical machine that persists between jobs, so an
      # identity added to a permanent keychain would stay there, usable by
      # every later job on the box. The keychain below exists for one job and
      # is deleted by the if: always() step at the bottom.
      #
      # KNOWN RESIDUAL, the same one macos-release.yml documents: `security
      # import` takes the p12 passphrase only via -P, its sole alternative
      # being an interactive GUI prompt that a headless runner cannot answer,
      # so that one argv is unavoidable and any process on the runner could
      # read it for the length of the call. It is worse here than on the
      # ephemeral macOS VM that workflow describes, because this runner is not
      # discarded: the mitigation is that the p12 it unlocks is deleted in the
      # same step and the keychain it unlocks into is deleted at the end of
      # the job. Closing it properly means hosted signing or a hardware token.
      #
      # No `set -x`, here or anywhere below: the passphrase, the keychain
      # password and the decoded p12 all pass through this shell.
      - name: Import signing material and archive
        env:
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          WATTRACKER_API_SCHEME: https
          WATTRACKER_API_HOST: ${{ secrets.WATTRACKER_IOS_API_HOST }}
          DIAGNOSE_SIGNING: ${{ inputs.diagnose_signing }}
        run: |
          set -euo pipefail
          if [ -z "${IOS_DIST_P12_B64:-}" ] || [ -z "${IOS_DIST_P12_PASSWORD:-}" ]; then
            echo "The distribution certificate secret is missing or empty." >&2
            exit 1
          fi
          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "APPLE_TEAM_ID is missing or empty." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/wattracker-ios-signing.keychain-db"
          keychain_password="$(/usr/bin/openssl rand -hex 32)"
          p12="$RUNNER_TEMP/wattracker-ios-signing.p12"
          cert_pem="$RUNNER_TEMP/wattracker-ios-distribution-cert.pem"
          original_default_keychain="$(security default-keychain -d user 2>/dev/null || true)"
          original_default_keychain="$(printf '%s\n' "$original_default_keychain" \
            | sed -n 's/^ *"\(.*\)" *$/\1/p')"
          if [ -z "$original_default_keychain" ]; then
            original_default_keychain="login.keychain-db"
          fi
          root_cert="$GITHUB_WORKSPACE/.github/certs/AppleIncRootCertificate.cer"
          root_expected_sha256="b0b1730ecbc7ff4505142c49f1295e6eda6bcaed7e2c68c5be91b5a11001f024"
          wwdr_cert="$GITHUB_WORKSPACE/.github/certs/AppleWWDRCAG3.cer"
          wwdr_expected_sha256="dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f"
          # Record this before creating or importing anything: the final
          # always-run step must know the path even when a later command fails.
          echo "IOS_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "IOS_ORIGINAL_DEFAULT_KEYCHAIN=$original_default_keychain" >> "$GITHUB_ENV"
          # Export is a separate step, so mask this generated password before
          # it crosses the step boundary. It is never printed.
          printf '::add-mask::%s\n' "$keychain_password"
          echo "IOS_SIGNING_KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"
          # umask before the redirection, not chmod after: the p12 must never
          # exist world-readable, not even for the instant between the two.
          if ! (umask 077; printf '%s' "$IOS_DIST_P12_B64" | base64 --decode > "$p12"); then
            echo "The distribution certificate secret is not valid base64." >&2
            exit 1
          fi
          if [ ! -s "$p12" ]; then
            echo "The distribution certificate secret is not valid base64." >&2
            exit 1
          fi
          # Validate the container and password before invoking `security`.
          # -passin env keeps the password out of argv and -nokeys ensures the
          # private key is never copied to the diagnostic file.
          if ! (umask 077; /usr/bin/openssl pkcs12 -in "$p12" -passin env:IOS_DIST_P12_PASSWORD \
              -clcerts -nokeys -out "$cert_pem" >/dev/null 2>&1); then
            echo "The distribution certificate p12 could not be opened; check its password." >&2
            exit 1
          fi
          chmod 600 "$cert_pem"
          leaf_cn="$(/usr/bin/openssl x509 -in "$cert_pem" -noout -subject \
            -nameopt sep_multiline,utf8 | sed -n 's/^ *CN=//p')"
          leaf_legal_name="$(/usr/bin/openssl x509 -in "$cert_pem" -noout -subject \
            -nameopt sep_multiline,utf8 | sed -n 's/^ *O=//p')"
          cert_team="$(/usr/bin/openssl x509 -in "$cert_pem" -noout -subject \
            -nameopt sep_multiline,utf8 | sed -n 's/^ *OU=//p')"
          if [ -z "$leaf_cn" ] || [ -z "$leaf_legal_name" ] || [ -z "$cert_team" ]; then
            echo "The distribution certificate subject is missing a required RDN." >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "$leaf_cn"
          printf '::add-mask::%s\n' "$leaf_legal_name"
          printf '::add-mask::%s\n' "$cert_team"
          if ! /usr/bin/openssl x509 -in "$cert_pem" -checkend 0 -noout >/dev/null 2>&1; then
            echo "The distribution certificate is expired." >&2
            exit 1
          fi
          if [ -z "$cert_team" ] || [ "$cert_team" != "$APPLE_TEAM_ID" ]; then
            echo "The distribution certificate team does not match APPLE_TEAM_ID." >&2
            exit 1
          fi
          if [ ! -f "$root_cert" ]; then
            echo "The checked-in Apple Root CA certificate is missing." >&2
            exit 1
          fi
          root_actual_sha256="$(shasum -a 256 "$root_cert" | awk '{print tolower($1)}')"
          if [ "$root_actual_sha256" != "$root_expected_sha256" ]; then
            echo "The checked-in Apple Root CA certificate failed fingerprint verification." >&2
            exit 1
          fi
          if [ ! -f "$wwdr_cert" ]; then
            echo "The checked-in Apple WWDR G3 certificate is missing." >&2
            exit 1
          fi
          wwdr_actual_sha256="$(shasum -a 256 "$wwdr_cert" | awk '{print tolower($1)}')"
          if [ "$wwdr_actual_sha256" != "$wwdr_expected_sha256" ]; then
            echo "The checked-in Apple WWDR G3 certificate failed fingerprint verification." >&2
            exit 1
          fi
          wwdr_cn="$(/usr/bin/openssl x509 -inform der -in "$wwdr_cert" -noout -subject \
            -nameopt sep_multiline,utf8 | sed -n 's/^ *CN=//p')"
          wwdr_legal_name="$(/usr/bin/openssl x509 -inform der -in "$wwdr_cert" -noout -subject \
            -nameopt sep_multiline,utf8 | sed -n 's/^ *O=//p')"
          if [ -n "$wwdr_cn" ]; then
            printf '::add-mask::%s\n' "$wwdr_cn"
          fi
          if [ -n "$wwdr_legal_name" ]; then
            printf '::add-mask::%s\n' "$wwdr_legal_name"
          fi
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # Verify the leaf against the pinned public chain before importing
          # the private identity. Do not call
          # add-trusted-cert: that mutates the runner's user trust database and
          # can summon SecurityAgent on a headless LaunchDaemon.
          if ! security verify-cert -p codeSign \
              -c "$cert_pem" -c "$wwdr_cert" -r "$root_cert" \
              >/dev/null 2>&1; then
            echo "The distribution certificate chain did not match the pinned Apple chain." >&2
            exit 1
          fi
          # Keep the disposable job keychain first, then expose Apple's
          # public System and SystemRoot stores for chain construction. The
          # persistent login keychain stays out of the search path, and the
          # non-job identity guard fails closed before codesign can select a
          # persistent key.
          security list-keychains -d user -s \
            "$keychain" \
            /Library/Keychains/System.keychain \
            /System/Library/Keychains/SystemRootCertificates.keychain
          # -x: the imported private key is not extractable, so nothing later
          # in this job (or a later job, if the delete below ever failed) can
          # read it back out of the keychain.
          security import "$p12" -k "$keychain" \
            -P "$IOS_DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -x
          if ! security import "$wwdr_cert" -k "$keychain" -T /usr/bin/codesign \
              >/dev/null 2>&1; then
            echo "The checked-in Apple WWDR G3 certificate could not be imported." >&2
            exit 1
          fi
          # The job keychain contains the leaf, private key, and pinned WWDR;
          # the pinned root is verified above and Apple's public System and
          # SystemRoot stores provide the trust anchor. The persistent login
          # keychain remains excluded. Without --keychain, codesign uses this
          # search list for identity selection and chain construction, while
          # the non-job identity guard above prevents a persistent signing key
          # from being selected.
          rm -f "$p12"
          # Assert the identity is actually there before spending ten minutes
          # on an archive that would fail at the codesign step. `grep -c`
          # exits 1 on no match, hence the `|| true`, and the default covers
          # find-identity itself failing under `set -o pipefail`. The count is
          # all that is printed - never the identity hashes.
          # Diagnostics, opt-in. Capture every security response before
          # summarising it: the raw responses contain identity labels,
          # subjects, common names, and team identifiers, none of which may
          # reach the log. The summary is deliberately limited to counts,
          # CSSMERR status codes, certificate types, and expiry dates.
          if [ "${DIAGNOSE_SIGNING:-false}" = "true" ]; then
            valid_identity_output="$(security find-identity -v -p codesigning "$keychain" 2>&1 || true)"
            all_identity_output="$(security find-identity -p codesigning "$keychain" 2>&1 || true)"
            valid_identity_count="$(printf '%s\n' "$valid_identity_output" \
              | grep -Ec '^[[:space:]]+[0-9]+\)' || true)"
            all_identity_count="$(printf '%s\n' "$all_identity_output" \
              | grep -Ec '^[[:space:]]+[0-9]+\)' || true)"
            status_codes="$(printf '%s\n' "$all_identity_output" \
              | grep -oE 'CSSMERR_[A-Z0-9_]+' | sort -u || true)"
            status_count="$(printf '%s\n' "$status_codes" \
              | grep -Ec '^CSSMERR_[A-Z0-9_]+$' || true)"
            leaf_expiry="$(/usr/bin/openssl x509 -in "$cert_pem" -noout -enddate \
              | sed 's/^notAfter=//')"
            wwdr_expiry="$(/usr/bin/openssl x509 -inform der -in "$wwdr_cert" \
              -noout -enddate | sed 's/^notAfter=//')"
            root_cert_count="$(security find-certificate -a -p -c 'Apple Root CA' \
              "$keychain" 2>/dev/null \
              | grep -c '^-----BEGIN CERTIFICATE-----' || true)"
            wwdr_cert_count="$(security find-certificate -a -p -c \
              'Apple Worldwide Developer Relations Certification Authority' \
              "$keychain" 2>/dev/null \
              | grep -c '^-----BEGIN CERTIFICATE-----' || true)"
            system_root_cert_count="$(security find-certificate -a -p -c 'Apple Root CA' \
              /System/Library/Keychains/SystemRootCertificates.keychain 2>/dev/null \
              | grep -c '^-----BEGIN CERTIFICATE-----' || true)"
            leaf_issuer_hash="$(/usr/bin/openssl x509 -in "$cert_pem" \
              -noout -issuer_hash)"
            wwdr_subject_hash="$(/usr/bin/openssl x509 -inform der -in "$wwdr_cert" \
              -noout -subject_hash)"
            if [ "$leaf_issuer_hash" = "$wwdr_subject_hash" ]; then
              issuer_match="yes"
            else
              issuer_match="no"
            fi
            if security verify-cert -q -p codeSign -c "$cert_pem" \
                -k "$keychain" >/dev/null 2>&1; then
              job_chain_status="pass"
            else
              job_chain_status="fail"
            fi
            if security verify-cert -q -p codeSign -c "$cert_pem" \
                -k "$keychain" \
                -k /Library/Keychains/System.keychain \
                -k /System/Library/Keychains/SystemRootCertificates.keychain \
                >/dev/null 2>&1; then
              search_chain_status="pass"
            else
              search_chain_status="fail"
            fi
            probe_identity_hash="$(printf '%s\n' "$valid_identity_output" \
              | sed -n 's/^[[:space:]]*[0-9]*) \([0-9A-Fa-f]\{40\}\) .*/\1/p' \
              | head -n 1)"
            printf 'Diagnostic valid identity count: %s\n' "$valid_identity_count"
            printf 'Diagnostic all identity count: %s\n' "$all_identity_count"
            printf 'Diagnostic CSSMERR status count: %s\n' "$status_count"
            printf 'Diagnostic job Apple Root CA certificate count: %s\n' "$root_cert_count"
            printf 'Diagnostic job Apple WWDR G3 certificate count: %s\n' "$wwdr_cert_count"
            printf 'Diagnostic system Apple Root CA certificate count: %s\n' "$system_root_cert_count"
            printf 'Diagnostic leaf issuer matches pinned WWDR: %s\n' "$issuer_match"
            printf 'Diagnostic job-only code-sign chain: %s\n' "$job_chain_status"
            printf 'Diagnostic full-search code-sign chain: %s\n' "$search_chain_status"
            if [ -n "$status_codes" ]; then
              printf '%s\n' "$status_codes" | while IFS= read -r status; do
                printf 'Diagnostic CSSMERR status: %s\n' "$status"
              done
            fi
            printf 'Diagnostic certificate type: Apple Distribution leaf\n'
            printf 'Diagnostic certificate expiry: %s\n' "$leaf_expiry"
            printf 'Diagnostic certificate type: Apple WWDR G3 intermediate\n'
            printf 'Diagnostic certificate expiry: %s\n' "$wwdr_expiry"
          fi
          non_job_identities="$(
            security find-identity -v -p codesigning /Library/Keychains/System.keychain 2>&1 || true
            security find-identity -v -p codesigning /System/Library/Keychains/SystemRootCertificates.keychain 2>&1 || true
            security find-identity -v -p codesigning login.keychain-db 2>&1 || true
          )"
          non_job_identity_count="$(printf '%s\n' "$non_job_identities" \
            | grep -Ec '^[[:space:]]+[0-9]+\)' || true)"
          if [ "${non_job_identity_count:-0}" -ne 0 ]; then
            echo "A non-job keychain contains a signing identity; refusing to sign." >&2
            exit 1
          fi
          identities="$(security find-identity -v -p codesigning "$keychain" 2>&1 || true)"
          identity_count="$(printf '%s\n' "$identities" \
            | grep -Ec '^[[:space:]]+[0-9]+\)' || true)"
          distribution_count="$(printf '%s\n' "$identities" \
            | grep -c 'Apple Distribution' || true)"
          if [ "${identity_count:-0}" -ne 1 ] || [ "${distribution_count:-0}" -ne 1 ]; then
            echo "The signing keychain does not contain exactly one Apple Distribution identity." >&2
            exit 1
          fi
          echo "Imported the distribution identity into a job-scoped keychain."

          # Keep import and archive in one process. The runner's keychain and
          # Security.framework session then remain the same while codesign
          # builds the Apple chain; export is a separate action and repeats
          # the unlock and partition setup below.
          export IOS_CERT_CN="$(/usr/bin/openssl x509 \
            -in "$RUNNER_TEMP/wattracker-ios-distribution-cert.pem" -noout -subject \
            -nameopt sep_multiline,utf8 | sed -n 's/^ *CN=//p')"
          export IOS_CERT_LEGAL_NAME="$(/usr/bin/openssl x509 \
            -in "$RUNNER_TEMP/wattracker-ios-distribution-cert.pem" -noout -subject \
            -nameopt sep_multiline,utf8 | sed -n 's/^ *O=//p')"
          if [ -z "$IOS_CERT_CN" ] || [ -z "$IOS_CERT_LEGAL_NAME" ]; then
            echo "The distribution certificate subject is missing a required RDN." >&2
            exit 1
          fi

          # xcodebuild can echo the full signing identity on either stream.
          # Keep the streams separate, redact complete identity lines, and
          # return the child status so a failed archive cannot be hidden by
          # the redaction process.
          archive_with_redacted_output() {
            /usr/bin/perl - "$@" <<'PERL'
          use strict;
          use warnings;
          use IO::Select;
          use IPC::Open3;
          use Symbol qw(gensym);

          my @redactions = grep { defined($_) && length($_) }
              @ENV{qw(IOS_CERT_CN IOS_CERT_LEGAL_NAME APPLE_TEAM_ID)};

          sub redact {
              my ($line) = @_;
              for my $value (@redactions) {
                  $line =~ s/\Q$value\E/[REDACTED]/g;
              }
              $line =~ s/^([^\r\n]*Signing Identity:)[^\r\n]*/$1 [REDACTED]/mg;
              return $line;
          }

          my $child_stderr = gensym();
          my ($child_stdin, $child_stdout);
          my $pid = open3($child_stdin, $child_stdout, $child_stderr, @ARGV);
          close $child_stdin;

          my $select = IO::Select->new($child_stdout, $child_stderr);
          my %buffers = map { fileno($_) => '' } ($child_stdout, $child_stderr);
          my %destinations = (
              fileno($child_stdout) => \*STDOUT,
              fileno($child_stderr) => \*STDERR,
          );
          while ($select->count) {
              for my $handle ($select->can_read) {
                  my $fd = fileno($handle);
                  my $bytes = sysread($handle, my $chunk, 8192);
                  die "xcodebuild output read failed\n" if !defined($bytes);
                  if ($bytes == 0) {
                      my $tail = delete $buffers{$fd};
                      print { $destinations{$fd} } redact($tail) if length($tail);
                      $select->remove($handle);
                      close $handle;
                      next;
                  }
                  $buffers{$fd} .= $chunk;
                  while ($buffers{$fd} =~ s/\A(.*?\n)//s) {
                      print { $destinations{$fd} } redact($1);
                  }
              }
          }

          waitpid($pid, 0);
          my $status = $?;
          exit 127 if $status == -1;
          exit 128 + ($status & 127) if $status & 127;
          exit $status >> 8;
          PERL
          }

          # Import and archive share the same security session. Re-establish
          # the complete search list, make the job keychain the default, then
          # re-unlock it and set the partition list immediately before the
          # archive. Do not pass OTHER_CODE_SIGN_FLAGS=--keychain: codesign
          # must see Apple's public System/SystemRoot stores while the non-job identity
          # guard above prevents a persistent signing key from being selected.
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user -s \
            "$keychain" \
            /Library/Keychains/System.keychain \
            /System/Library/Keychains/SystemRootCertificates.keychain
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null

          if [ "${DIAGNOSE_SIGNING:-false}" = "true" ]; then
            probe_path="$RUNNER_TEMP/wattracker-codesign-probe"
            probe_error="$RUNNER_TEMP/wattracker-codesign-probe.err"
            cp /usr/bin/true "$probe_path"
            if [ -n "$probe_identity_hash" ] && \
                /usr/bin/codesign --force --timestamp=none \
                  --sign "$probe_identity_hash" --keychain "$keychain" \
                  "$probe_path" > /dev/null 2> "$probe_error"; then
              explicit_codesign_status="pass"
            elif grep -q 'unable to build chain to self-signed root' "$probe_error"; then
              explicit_codesign_status="fail:chain"
            elif grep -q 'errSecInternalComponent' "$probe_error"; then
              explicit_codesign_status="fail:internal"
            elif grep -qi 'user interaction is not allowed' "$probe_error"; then
              explicit_codesign_status="fail:interaction"
            else
              explicit_codesign_status="fail:other"
            fi
            if [ -n "$probe_identity_hash" ] && \
                /usr/bin/codesign --force --timestamp=none \
                  --sign "$probe_identity_hash" "$probe_path" \
                  > /dev/null 2> "$probe_error"; then
              search_codesign_status="pass"
            elif grep -q 'unable to build chain to self-signed root' "$probe_error"; then
              search_codesign_status="fail:chain"
            elif grep -q 'errSecInternalComponent' "$probe_error"; then
              search_codesign_status="fail:internal"
            elif grep -qi 'user interaction is not allowed' "$probe_error"; then
              search_codesign_status="fail:interaction"
            else
              search_codesign_status="fail:other"
            fi
            if [ -n "$probe_identity_hash" ] && \
                /usr/bin/codesign --force --timestamp=none \
                  --sign "$probe_identity_hash" \
                  --keychain /Library/Keychains/System.keychain \
                  --keychain /System/Library/Keychains/SystemRootCertificates.keychain \
                  --keychain "$keychain" "$probe_path" \
                  > /dev/null 2> "$probe_error"; then
              system_and_job_codesign_status="pass"
            elif grep -q 'unable to build chain to self-signed root' "$probe_error"; then
              system_and_job_codesign_status="fail:chain"
            elif grep -q 'errSecInternalComponent' "$probe_error"; then
              system_and_job_codesign_status="fail:internal"
            elif grep -qi 'user interaction is not allowed' "$probe_error"; then
              system_and_job_codesign_status="fail:interaction"
            else
              system_and_job_codesign_status="fail:other"
            fi
            if [ -n "$probe_identity_hash" ] && \
                /usr/bin/codesign --force --timestamp=none \
                  --sign "$probe_identity_hash" \
                  --keychain "$keychain" \
                  --keychain /System/Library/Keychains/SystemRootCertificates.keychain \
                  "$probe_path" \
                  > /dev/null 2> "$probe_error"; then
              job_and_system_root_codesign_status="pass"
            elif grep -q 'unable to build chain to self-signed root' "$probe_error"; then
              job_and_system_root_codesign_status="fail:chain"
            elif grep -q 'errSecInternalComponent' "$probe_error"; then
              job_and_system_root_codesign_status="fail:internal"
            elif grep -qi 'user interaction is not allowed' "$probe_error"; then
              job_and_system_root_codesign_status="fail:interaction"
            else
              job_and_system_root_codesign_status="fail:other"
            fi
            rm -f "$probe_path" "$probe_error"
            printf 'Diagnostic post-partition explicit codesign probe: %s\n' \
              "$explicit_codesign_status"
            printf 'Diagnostic post-partition search-list codesign probe: %s\n' \
              "$search_codesign_status"
            printf 'Diagnostic system-and-job codesign probe: %s\n' \
              "$system_and_job_codesign_status"
            printf 'Diagnostic job-and-system-root codesign probe: %s\n' \
              "$job_and_system_root_codesign_status"
          fi

          archive_with_redacted_output xcodebuild archive \
            -project ios/WatTracker/WatTracker.xcodeproj \
            -scheme WatTracker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WatTracker.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/ios-archive-dd" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="WatTracker App Store" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            WATTRACKER_API_SCHEME="$WATTRACKER_API_SCHEME" \
            WATTRACKER_API_HOST="$WATTRACKER_API_HOST" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # The archive in the combined signing step above. Four groups of
      # arguments are doing distinct work:
      #
      # 1. The signing overrides. Config/Base.xcconfig ad-hoc signs
      #    (CODE_SIGN_IDENTITY = -, CODE_SIGNING_REQUIRED = NO,
      #    CODE_SIGN_STYLE = Manual) so that a clone with no Apple credentials
      #    still builds for a simulator. A device archive needs the opposite of
      #    two of those three. Command-line build settings beat an xcconfig, so
      #    they are overridden here and nowhere on disk changes - which is the
      #    point: the team identifier exists only in this process's argument
      #    list, for the length of this step.
      #
      # 2. MANUAL signing with a named profile, and this is the part that was
      #    wrong before. CODE_SIGN_STYLE=Automatic does not work for this
      #    project: Xcode decides development-vs-distribution for automatic
      #    signing from the target's ProvisioningStyle attribute in the
      #    .pbxproj, and this project deliberately has no such attribute -
      #    every signing setting lives in the xcconfig so that a
      #    credential-less clone still builds. With nothing to read, automatic
      #    signing resolves to development and the archive fails; both of the
      #    failure messages are quoted in the certificate-import step above.
      #
      #    Manual signing removes the guess. PROVISIONING_PROFILE_SPECIFIER
      #    names the App Store profile by name; -allowProvisioningUpdates below
      #    downloads it from the developer portal, so it is neither installed
      #    on the runner nor carried as a secret. It has to already exist in
      #    the account - docs/ios-testflight.md has the one-time creation.
      #
      #    The signing search list contains the job keychain first, then
      #    Apple's public System and SystemRoot keychains. The import step
      #    fails closed if any non-job keychain contains a signing identity.
      #    The leaf and WWDR are in the job keychain; the pinned root/WWDR/
      #    leaf chain was verified before import. Do not pass --keychain here:
      #    the explicit search path retains the public trust stores, while
      #    the non-job identity guard prevents a persistent private key from
      #    being selected.
      #    The combined signing step temporarily makes this keychain the user's default
      #    as well, because Security.framework's non-GUI signing path consults
      #    that default while opening the private key. The previous default is
      #    captured without printing it and restored by the always-run cleanup.
      #
      # 3. -allowProvisioningUpdates plus the three -authenticationKey* flags.
      #    Together these let xcodebuild talk to the developer portal as the
      #    API key, to register the App ID for com.wattracker.ios if it does
      #    not exist and to download the App Store provisioning profile. Note
      #    what is NOT in that list: it does not issue the distribution
      #    certificate. See the import step above. Without the key flags,
      #    -allowProvisioningUpdates falls back to an Apple account configured
      #    in Xcode's own Accounts pane, which a CI job does not have.
      #
      # 4. The version numbers, from the step above.
      #
      # -destination 'generic/platform=iOS' rather than a concrete device: an
      # archive is built for the device family, not for one device.
      #
      # No -verbose. The verbose log echoes the full compiler and codesign
      # invocations, which include -authenticationKeyPath; the path is not
      # itself secret, but a log that names it invites the next person to paste
      # it somewhere. -quiet is not used either - the default is the level at
      # which a signing failure is readable.
      # -exportArchive re-signs the archived app for distribution, so it needs
      # the portal credentials too - this is the step that downloads the App
      # Store profile if the archive step only just created it.
      #
      # It also needs the signing keychain, which is why the cleanup that
      # deletes it is at the bottom of the job and not immediately after the
      # archive. -exportArchive takes no build settings, so there is no
      # --keychain to pass here: it resolves the identity through the keychain
      # search list, which the combined signing step set to the job keychain
      # first, followed by Apple's public System and SystemRoot keychains. The job
      # identity guard prevents a persistent signing key from being selected.
      # ios/WatTracker/ExportOptions.plist names the same profile the
      # archive was signed with; a mismatch there re-signs with something else
      # and is not caught until Apple rejects the upload.
      - name: Export the signed .ipa
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          export IOS_CERT_CN="$(/usr/bin/openssl x509 \
            -in "$RUNNER_TEMP/wattracker-ios-distribution-cert.pem" -noout -subject \
            -nameopt sep_multiline,utf8 | sed -n 's/^ *CN=//p')"
          export IOS_CERT_LEGAL_NAME="$(/usr/bin/openssl x509 \
            -in "$RUNNER_TEMP/wattracker-ios-distribution-cert.pem" -noout -subject \
            -nameopt sep_multiline,utf8 | sed -n 's/^ *O=//p')"
          if [ -z "$IOS_CERT_CN" ] || [ -z "$IOS_CERT_LEGAL_NAME" ]; then
            echo "The distribution certificate subject is missing a required RDN." >&2
            exit 1
          fi

          # Export can also print the signing identity. Keep it behind the
          # same stream filter as archive so a later Xcode change cannot put
          # the leaf CN or legal name into the public Actions log.
          export_with_redacted_output() {
            /usr/bin/perl - "$@" <<'PERL'
          use strict;
          use warnings;
          use IO::Select;
          use IPC::Open3;
          use Symbol qw(gensym);

          my @redactions = grep { defined($_) && length($_) }
              @ENV{qw(IOS_CERT_CN IOS_CERT_LEGAL_NAME APPLE_TEAM_ID)};

          sub redact {
              my ($line) = @_;
              for my $value (@redactions) {
                  $line =~ s/\Q$value\E/[REDACTED]/g;
              }
              $line =~ s/^([^\r\n]*Signing Identity:)[^\r\n]*/$1 [REDACTED]/mg;
              return $line;
          }

          my $child_stderr = gensym();
          my ($child_stdin, $child_stdout);
          my $pid = open3($child_stdin, $child_stdout, $child_stderr, @ARGV);
          close $child_stdin;

          my $select = IO::Select->new($child_stdout, $child_stderr);
          my %buffers = map { fileno($_) => '' } ($child_stdout, $child_stderr);
          my %destinations = (
              fileno($child_stdout) => \*STDOUT,
              fileno($child_stderr) => \*STDERR,
          );
          while ($select->count) {
              for my $handle ($select->can_read) {
                  my $fd = fileno($handle);
                  my $bytes = sysread($handle, my $chunk, 8192);
                  die "xcodebuild output read failed\n" if !defined($bytes);
                  if ($bytes == 0) {
                      my $tail = delete $buffers{$fd};
                      print { $destinations{$fd} } redact($tail) if length($tail);
                      $select->remove($handle);
                      close $handle;
                      next;
                  }
                  $buffers{$fd} .= $chunk;
                  while ($buffers{$fd} =~ s/\A(.*?\n)//s) {
                      print { $destinations{$fd} } redact($1);
                  }
              }
          }

          waitpid($pid, 0);
          my $status = $?;
          exit 127 if $status == -1;
          exit 128 + ($status & 127) if $status & 127;
          exit $status >> 8;
          PERL
          }

          security list-keychains -d user -s \
            "$IOS_SIGNING_KEYCHAIN" \
            /Library/Keychains/System.keychain \
            /System/Library/Keychains/SystemRootCertificates.keychain
          security unlock-keychain -p "$IOS_SIGNING_KEYCHAIN_PASSWORD" "$IOS_SIGNING_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$IOS_SIGNING_KEYCHAIN_PASSWORD" "$IOS_SIGNING_KEYCHAIN" > /dev/null

          export_with_redacted_output xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WatTracker.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ipa="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$ipa" ]; then
            echo "Export produced no .ipa" >&2
            exit 1
          fi
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"
          echo "Exported $(basename "$ipa")"
          # The key must not have been copied anywhere by the export. Cheap
          # assertion, and the thing it guards against - a .p8 inside the
          # payload - would otherwise ship to Apple and to every tester.
          if find "$RUNNER_TEMP/export" "$RUNNER_TEMP/WatTracker.xcarchive" -name '*.p8' | grep -q .; then
            echo "A .p8 was found inside the archive or export. Refusing to upload." >&2
            exit 1
          fi

      # altool, and it is present: `xcrun --find altool` resolves on this
      # runner under Xcode 26.6 (altool 26.40.1), and --upload-app with
      # --api-key/--api-issuer is still its documented App Store delivery path.
      # notarytool is NOT the alternative - it submits macOS software for
      # notarization and cannot deliver an iOS build to App Store Connect.
      #
      # --p8-file-path rather than altool's search path. altool otherwise looks
      # for AuthKey_<id>.p8 in ./private_keys, ~/private_keys, ~/.private_keys
      # and ~/.appstoreconnect/private_keys, and on this runner the last of
      # those is a real human's home directory with a real key in it. A search
      # path would let this job silently authenticate with a machine-local
      # credential nobody declared - and appear to work while the secret it is
      # supposed to be testing was wrong. An explicit path cannot do that.
      #
      # --validate-app first: it runs Apple's own checks on the package and,
      # importantly, is where a missing App Store Connect app record surfaces -
      # in seconds, with a message that names the problem, instead of after a
      # full upload. See docs/ios-testflight.md for the one-time record
      # creation, which no API can do for us.
      #
      # The key id and issuer id are on the argument list here and in the two
      # xcodebuild steps above, where any process on the runner could read them
      # for the duration of the call. They are identifiers, not the credential:
      # neither is usable without the .p8, which stays in a 0600 file. altool
      # offers no way to pass them off argv. macos-release.yml documents the
      # same residual for `security import`.
      - name: Validate and upload to TestFlight
        # Tag runs only. A manual dispatch is for exercising the signing
        # and archive path; it must never be able to publish a build to
        # App Store Connect, where a bad build number cannot be reused.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ios-v')
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            --file "$IPA_PATH" \
            --type ios \
            --api-key "$ASC_KEY_ID" \
            --api-issuer "$ASC_ISSUER_ID" \
            --p8-file-path "$ASC_KEY_PATH"
          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --api-key "$ASC_KEY_ID" \
            --api-issuer "$ASC_ISSUER_ID" \
            --p8-file-path "$ASC_KEY_PATH"
          echo "Uploaded build $BUILD_NUMBER of version $MARKETING_VERSION."
          echo "App Store Connect processes it asynchronously; it appears in"
          echo "TestFlight once processing finishes."

      # THERE IS DELIBERATELY NO ARTIFACT UPLOAD.
      #
      # The .p8 is not the reason - the step above asserts it is not in the
      # payload. The reason is the team identifier. A distribution-signed .ipa
      # embeds embedded.mobileprovision, whose TeamIdentifier is the team id,
      # and the signing certificate's subject carries it too. Artifacts on a
      # public repository are downloadable by anyone, so uploading the .ipa
      # would publish the one identifier this whole workflow goes out of its
      # way to keep out of the tree. None of that is secret to Apple or to a
      # tester who installs the app - it is secret to the internet, which is a
      # different question, and the artifact store is the internet.
      #
      # Nothing needs the .ipa anyway: the build's destination is TestFlight,
      # and testers install it from there. (The account's Actions artifact
      # storage is also full - see the long note in windows.yml - so an upload
      # would turn a green release into a red one.)

      # Unconditional, and it is the only thing standing between a private key
      # and a machine that persists between jobs. It must not depend on any
      # earlier step succeeding, must not fail the job if the paths are already
      # gone, and must not print what it is removing beyond the fact that it
      # ran.
      - name: Remove the signing material
        if: always()
        run: |
          set -euo pipefail
          cleanup_status=0
          # The keychain first: it holds the distribution private key, and it
          # is the one piece of this that would still be usable tomorrow. The
          # search list is put back before the keychain is deleted so that a
          # failure to delete does not also leave the runner pointing at a
          # keychain that is gone.
          #
          # `-s login.keychain-db` resets the list to the default rather than
          # to whatever it was, which is what macos-release.yml does and is
          # worth naming as a difference: that job runs on a VM nobody else
          # uses, and this one does not. If the ci-runner account is ever
          # given extra keychains of its own, this line drops them from its
          # search list and they have to be added back.
          if [ -n "${IOS_ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -d user -s "$IOS_ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi
          security list-keychains -d user -s login.keychain-db || true
          if [ -n "${IOS_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$IOS_SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/wattracker-ios-signing.p12" || true
          rm -f "$RUNNER_TEMP/wattracker-ios-distribution-cert.pem" || true
          rm -rf "$RUNNER_TEMP/asc" || true
          rm -f "$RUNNER_TEMP/ExportOptions.plist" || true
          # The archive and the export both carry the team identifier in the
          # embedded provisioning profile, and DerivedData holds a copy of
          # everything that was built. On a runner that is discarded this would
          # not matter; this one is not discarded.
          rm -rf "$RUNNER_TEMP/WatTracker.xcarchive" "$RUNNER_TEMP/export" || true
          rm -rf "$RUNNER_TEMP/ios-archive-dd" "$RUNNER_TEMP/ios-test-dd" || true
          if [ -e "$RUNNER_TEMP/asc" ]; then
            echo "The App Store Connect key directory could not be removed." >&2
            exit 1
          fi
          if [ -n "${IOS_SIGNING_KEYCHAIN:-}" ] && [ -e "$IOS_SIGNING_KEYCHAIN" ]; then
            echo "The signing keychain could not be removed. It holds the" >&2
            echo "distribution private key and this runner is not discarded." >&2
            cleanup_status=1
          fi
          if [ "$cleanup_status" -ne 0 ]; then
            exit "$cleanup_status"
          fi
          echo "Signing material removed."
