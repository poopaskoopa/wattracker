name: Windows signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-test-sign:
    if: ${{ false }}
    runs-on: windows-latest
    environment: windows-code-signing
    timeout-minutes: 45
    env:
      WATTRACKER_AUTO_SCAN: "0"
      WATTRACKER_OPEN_BROWSER: "0"

    steps:
      - name: Check out selected source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned build tools and project
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==25.1.1"
          # The PyInstaller pin lives in pyproject's [package] extra so the
          # Windows and macOS release builds cannot drift apart.
          # connector + webview are the frozen connector's own halves: the
          # websockets client it dials with, and the ctypes WebView binding the
          # tray's window uses. Both are collected best-effort by the spec, so
          # missing them here would produce a connector that builds and is
          # quietly missing a feature.
          python -m pip install --disable-pip-version-check "build==1.2.2.post1" ".[dev,ble,package,connector,webview]"

      - name: Run full test suite
        shell: pwsh
        run: python -m pytest -q

      - name: Build and smoke-test installed wheel
        shell: pwsh
        run: |
          python -m build --wheel --outdir wheelhouse
          $wheel = (Get-ChildItem -Path "wheelhouse\*.whl" | Select-Object -First 1).FullName
          if (-not $wheel) { throw "Wheel build produced no artifact" }
          python -m venv wheel-smoke
          .\wheel-smoke\Scripts\python.exe -m pip install --disable-pip-version-check $wheel
          .\wheel-smoke\Scripts\python.exe "packaging\smoke_installed.py"

      - name: Build frozen onedir application
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "packaging\wattracker.spec")) {
            throw "packaging/wattracker.spec is required for a signed release"
          }
          python -m PyInstaller --clean --noconfirm "packaging\wattracker.spec"
          if (-not (Test-Path -LiteralPath "dist\wattracker\wattracker.exe")) {
            throw "Frozen application was not produced"
          }

      - name: Smoke-test frozen application
        shell: pwsh
        run: |
          & "packaging\smoke_frozen.ps1" -ExecutablePath "dist\wattracker\wattracker.exe"

      # Serving the UI does not prove bleak's backend survived packaging: a
      # build that lost it starts and serves every page identically, and only
      # fails once someone tries to find a trainer. The runner has no radio, so
      # this asserts availability (an `import bleak` check, independent of
      # hardware) and that a scan does not fail with an import error. Add
      # --require-device only where a trainer is actually powered on.
      - name: Assert frozen application can still see Bluetooth
        shell: pwsh
        run: |
          python "packaging\smoke_frozen_ble.py" "dist\wattracker\wattracker.exe"

      # The connector is a second, separate artifact: onefile and windowed,
      # for the machine where Zwift lives. It is built here rather than in its
      # own workflow so it cannot drift from the app's toolchain pin, and so
      # one tag produces both halves of a split install.
      - name: Build frozen onefile connector
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "packaging\wattracker-connector.spec")) {
            throw "packaging/wattracker-connector.spec is required for a signed release"
          }
          python -m PyInstaller --clean --noconfirm "packaging\wattracker-connector.spec"
          if (-not (Test-Path -LiteralPath "dist\WattrackerConnector.exe")) {
            throw "Frozen connector was not produced"
          }

      # Unlike the app, the connector serves no UI to smoke-test, so this is
      # the only thing that proves the binary does anything at all: it must
      # refuse to run unpaired, connect and answer a request against a stub
      # server, and still be able to import bleak and webviewpy.
      - name: Smoke-test frozen connector
        shell: pwsh
        run: |
          python "packaging\smoke_frozen_connector.py" "dist\WattrackerConnector.exe"

      - name: Sign and verify every frozen binary
        shell: pwsh
        env:
          WATTRACKER_SIGNING_PFX_B64: ${{ secrets.WATTRACKER_SIGNING_PFX_B64 }}
          WATTRACKER_SIGNING_PFX_PASSWORD: ${{ secrets.WATTRACKER_SIGNING_PFX_PASSWORD }}
          WATTRACKER_SIGNING_THUMBPRINT: ${{ vars.WATTRACKER_SIGNING_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WATTRACKER_SIGNING_THUMBPRINT)) {
            throw "Protected signing thumbprint is required"
          }
          & "packaging\sign-windows.ps1" `
            -ArtifactPath "dist\wattracker" `
            -ExpectedThumbprint $env:WATTRACKER_SIGNING_THUMBPRINT
          # Signed separately: it is one file outside dist\wattracker, and an
          # unsigned autostarting binary that holds a credential is the last
          # thing that should slip through on a technicality.
          & "packaging\sign-windows.ps1" `
            -ArtifactPath "dist\WattrackerConnector.exe" `
            -ExpectedThumbprint $env:WATTRACKER_SIGNING_THUMBPRINT

      - name: Package verified signed artifact and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release" | Out-Null
          Compress-Archive -Path "dist\wattracker\*" `
            -DestinationPath "release\wattracker-windows-x64-signed.zip"
          $archive = Resolve-Path "release\wattracker-windows-x64-signed.zip"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  wattracker-windows-x64-signed.zip" | `
            Set-Content -Path "release\wattracker-windows-x64-signed.zip.sha256" -Encoding ascii
          # The connector ships as the bare .exe, not zipped: the whole point
          # is that a rider downloads one file and runs it, and a zip would
          # only add a step. The checksum beside it is how they can tell it is
          # the file this workflow produced.
          Copy-Item -LiteralPath "dist\WattrackerConnector.exe" `
            -Destination "release\WattrackerConnector.exe"
          $connector = Resolve-Path "release\WattrackerConnector.exe"
          $connectorHash = (Get-FileHash -LiteralPath $connector -Algorithm SHA256).Hash.ToLowerInvariant()
          "$connectorHash  WattrackerConnector.exe" | `
            Set-Content -Path "release\WattrackerConnector.exe.sha256" -Encoding ascii

      - name: Upload signed artifact only
        uses: actions/upload-artifact@v4
        with:
          name: wattracker-windows-x64-signed
          path: |
            release/wattracker-windows-x64-signed.zip
            release/wattracker-windows-x64-signed.zip.sha256
            release/WattrackerConnector.exe
            release/WattrackerConnector.exe.sha256
          if-no-files-found: error
          retention-days: 30
