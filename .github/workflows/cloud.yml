name: Cloud

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Runs on a self-hosted macOS runner. Self-hosted runners are not billed, so
  # this survives the hosted-minutes outage that hard-disabled the Windows
  # workflow. Keep this job free of container actions and Docker: a macOS
  # runner cannot run either, which is why the containerised checks live in
  # the separate job below.
  tests:
    # The repository is public and this runner is a physical machine that is not
    # torn down between jobs, so a pull request from a fork must never reach it:
    # the install step below executes the PR's own build backend and pytest
    # executes its conftest.py, both as the runner's user account. GitHub's
    # first-time-contributor approval prompt is not a substitute - approving a
    # contributor once exempts every later PR from that account.
    #
    # The consequence is that a fork PR gets no CI from this job. It still gets
    # bicep-validation and, since 2026-09-03, containerized: both run on a
    # hosted ubuntu-latest runner with no secrets exposed to a Docker build,
    # so they are safe to run unreviewed. Full self-hosted coverage still
    # needs a human: push the fork's head to a branch in this repository,
    # which is also the point at which someone has read the diff.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # This runner is a laptop. It accepts a job from a maintenance wake and
      # can sleep again mid-run, which kills the job with no failing test and
      # no uploaded logs -- seen 2026-09-03 on both `main` and a PR, each
      # dying at exactly 10m00s and each green on re-run. caffeinate is bound
      # to the Runner.Worker PID with -w, so the assertion covers exactly this
      # job and is released when the worker exits, including on a cancel:
      # nothing is left holding the machine awake afterwards.
      #
      # -i is the one that matters here, because the observed failures were on
      # battery and -s is honoured only on AC. Neither survives the lid being
      # closed; clamshell sleep still ends the job.
      - name: Hold a sleep assertion for the duration of this job
        run: |
          worker=$(pgrep -x Runner.Worker | head -1)
          if [ -n "$worker" ]; then
            caffeinate -i -s -w "$worker" &
            echo "holding a sleep assertion against Runner.Worker $worker"
          else
            echo "::warning::no Runner.Worker found; this job can be killed by sleep"
          fi

      - name: Provision Python and install dependencies
        # Pinning the interpreter is required, not cosmetic: the runner's bare
        # `python3` is macOS's own 3.9 (3.8 is even earlier on PATH), both below
        # this project's requires-python of 3.12. pip silently filters out every
        # distribution whose Requires-Python excludes the interpreter, so the
        # failure surfaces as "No matching distribution found for
        # fastapi>=0.138.2" - a dependency floor that looks wrong but is not.
        #
        # uv rather than setup-python: setup-python's macOS installer writes to
        # /Users/runner/hostedtoolcache, which exists only on GitHub's hosted
        # runners, and the AGENT_TOOLSDIRECTORY override has to be set on the
        # runner service's own environment to take effect. uv provisions its own
        # CPython under its cache and needs no such path.
        #
        # The environment is built inside the workspace so a CI run can never
        # mutate the developer's own venv.
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # only-managed, because a discovered interpreter may be the wrong
          # architecture: Homebrew's /usr/local/opt/python@3.12 on this machine
          # is x86_64, which makes uv resolve x86_64 wheels and fall back to
          # building cryptography from source against a Rust toolchain that has
          # no x86 std ("can't find crate for `core`"). A managed CPython is
          # native arm64 and gets prebuilt wheels.
          uv venv --python 3.12 --python-preference only-managed .ci-venv
          uv pip install --python .ci-venv/bin/python -e ".[dev,cloud]"
          .ci-venv/bin/python -c "import sys; assert sys.version_info >= (3, 12), sys.version; print(sys.version)"

      - name: Verify cloud imports
        run: |
          .ci-venv/bin/python -c "import azure.data.tables, azure.identity, azure.storage.blob, cryptography"
          .ci-venv/bin/python -c "import wattracker.cloud.runtime"

      - name: Install Playwright Chromium
        # The DOM smoke tests are intentionally optional for local checkouts,
        # but this runner is the repository's browser gate. Install the exact
        # browser required by the Playwright package in the venv above so a
        # missing cache cannot silently turn UI coverage into skips.
        run: .ci-venv/bin/python -m playwright install chromium

      - name: Run full test suite
        env:
          # Pin to the workspace. Without it pytest can import a different
          # checkout's code and silently test the wrong tree.
          PYTHONPATH: ${{ github.workspace }}
        # -n auto (pytest-xdist) because this runner is a laptop and the job
        # has a 30-minute budget it has already lost once to sleep. Every test
        # is already process-independent - conftest's autouse isolated_env
        # gives each one its own tmp_path HOME/data dir/DB, and the browser
        # tests bind an ephemeral port - so distribution needs no new
        # isolation.
        #
        # worksteal, not the default `load` scheduler, and the difference is
        # not marginal: 2m38s vs 1m03s. This suite is 3004 fast tests (~0.06s
        # each) plus 36 playwright tests that cost ~4s apiece, and `load`
        # hands out a fixed slice per worker up front - whichever workers draw
        # the browser tests still grind through them long after the rest have
        # gone idle. worksteal lets an idle worker take work back off a busy
        # one, which is exactly the imbalance this suite has. Measured on the
        # runner class: 4m37s serial -> 49s, same 3041 passed / 94 skipped.
        run: .ci-venv/bin/python -m pytest -q -n auto --dist worksteal

  # Keep iOS coverage on the trusted self-hosted Mac; the guard prevents
  # untrusted fork code from executing on that runner.
  ios-tests:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Keep the laptop awake so simulator tests are not interrupted by sleep;
      # a booted simulator plus xcodebuild sits well inside the window where
      # this runner sleeping kills a job (#225). Guarded the same way the
      # `tests` job is: backgrounding the command means a failed pgrep would
      # otherwise leave the step exiting 0 with no assertion held at all, which
      # looks exactly like success.
      - name: Hold a sleep assertion for the duration of this job
        run: |
          worker=$(pgrep -x Runner.Worker | head -1)
          if [ -n "$worker" ]; then
            caffeinate -i -s -w "$worker" &
            echo "holding a sleep assertion against Runner.Worker $worker"
          else
            echo "::warning::no Runner.Worker found; this job can be killed by sleep"
          fi

      - name: Run iOS tests
        run: >-
          xcodebuild test
          -project ios/WatTracker/WatTracker.xcodeproj
          -scheme WatTracker
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -derivedDataPath "$RUNNER_TEMP/ios-test-dd"

  # Bicep is declarative and has no access to deployment secrets, so validate it
  # for every pull request, including fork requests. Keep the cloud image build
  # in the separately gated job below because it needs Docker and hosted Linux
  # minutes.
  bicep-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Bicep
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/azure/main.bicep --stdout > /dev/null

  # The image check answers "is the cloud extra actually installed in
  # readImage/syncImage" - without cryptography, verify_signature returns
  # False and every write 401s in production. Enabled 2026-09-03: this repo
  # is public, so GitHub-hosted standard runners (ubuntu-latest, native
  # linux/amd64, Docker preinstalled) are free here - the "needs hosted
  # Linux minutes" reason this job was parked for no longer holds, and
  # bicep-validation below has been running on ubuntu-latest on every PR
  # the whole time.
  containerized:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build cloud image
        run: docker build --file Dockerfile.cloud --tag wattracker-cloud:ci .

      - name: Verify cloud imports in image
        run: >-
          docker run --rm --entrypoint python wattracker-cloud:ci
          -c "import azure.data.tables, azure.identity, azure.storage.blob, cryptography; import wattracker.cloud.runtime"
