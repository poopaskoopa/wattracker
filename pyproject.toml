[project]
name = "wattracker"
version = "0.1.0"
description = "Local cross-platform cycling training app for FIT analysis, rider profiling, adaptive workout planning, Zwift export, race/calendar tracking, and optional BLE/ERG riding."
readme = "README.md"
requires-python = ">=3.12"
# Minimum versions pin past known-CVE-fixed releases (e.g. jinja2>=3.1.5,
# python-multipart>=0.0.18) for auditable, reproducible installs.
dependencies = [
    "fastapi>=0.138.2",
    "uvicorn[standard]>=0.49.0",
    "fitdecode>=0.11.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "anthropic>=0.115.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "keyring>=25.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# playwright drives the real UI in Chromium (tests/test_dom_smoke.py). It is
# optional: the browser binary is a ~150MB download outside pip
# (`playwright install chromium`), so machines and CI without it simply skip
# those tests instead of failing.
dev = ["pytest>=8.0", "httpx>=0.27", "playwright>=1.47", "websockets>=13.0"]
# Real-hardware Bluetooth riding. Not needed for core install or the test suite;
# requires a Bluetooth adapter + trainer/sensors to actually use.
ble = ["bleak>=0.22"]
# Optional cloud sync support. The local application remains fully functional
# without this extra; cloud-enabled deployments use Ed25519 public-key
# enrollment and request signatures.
cloud = [
    "cryptography>=42.0",
    "azure-identity>=1.17",
    "azure-storage-blob>=12.22",
    "azure-data-tables>=12.5",
]
# Freezing the app for release. Pinned exactly, not floored: PyInstaller's
# bootloader and its bundled hooks decide what ends up inside the artifact, so
# an unpinned bump can change the shipped binary without any change to this
# repository. Same pin as .github/workflows/windows-release.yml.
package = ["pyinstaller==6.16.0"]
# The connector: the half that runs on the machine where Zwift is installed.
# Deliberately tiny - it must not pull numpy/pandas/scipy/fastapi, because it
# gets frozen into a Windows executable (see tests/test_connector_client.py,
# which enforces exactly that).
connector = ["websockets>=13.0", "bleak>=0.22"]
# The tray's window onto the server's web UI. A ctypes binding over the
# webview/webview C library, so it costs one ~220KB native and no Python
# dependencies at all - which is why it is this and not pywebview, whose
# Windows path reaches WebView2 through pythonnet and a .NET bridge. Optional
# and imported lazily: a headless connector never loads it, and the test suite
# does not need it installed (see wattracker_connector/webview.py).
webview = ["webviewpy>=1.5"]

[project.scripts]
wattracker = "wattracker.__main__:main"
wattracker-restore = "wattracker.restore_backup:main"
wattracker-ftp-rescore = "wattracker.ftp_backfill:main"
wattracker-connector = "wattracker_connector.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wattracker*", "wattracker_connector*"]

[tool.setuptools.package-data]
wattracker = [
    "web/templates/*.html",
    "web/static/*.js",
    "web/static/*.css",
    "web/static/*.svg",
    "web/static/*.ico",
    "web/static/*.png",
    "web/static/vendor/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Real-browser DOM tests. They run by default (they add only a few
    # seconds) and skip themselves when playwright/chromium is absent.
    # Only these:  pytest -m browser      Everything else:  pytest -m "not browser"
    "browser: drives the app in a real Chromium via playwright",
]
