[project]
name = "tranalyzer"
version = "0.1.0"
description = "Local cross-platform cycling training analyzer: ingest .fit files, compute training-science metrics, detect plateau/overreach, prescribe progressive workouts as Zwift .zwo files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "fitdecode",
    "numpy",
    "pandas",
    "scipy",
    "anthropic",
    "jinja2",
    "python-multipart",
    "itsdangerous",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
tranalyzer = "tranalyzer.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tranalyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
